<svg xmlns="http://www.w3.org/2000/svg" width="850" height="280" viewBox="0 0 850 280" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Animated Glow Orbs -->
    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#a78bfa"/>
      <stop offset="66%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Container -->
  <rect width="850" height="280" rx="20" fill="url(#bg-grad)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M0 40H850 M0 80H850 M0 120H850 M0 160H850 M0 200H850 M0 240H850" stroke="#ffffff" stroke-width="1"/>
    <path d="M70 0V280 M140 0V280 M210 0V280 M280 0V280 M350 0V280 M420 0V280 M490 0V280 M560 0V280 M630 0V280 M700 0V280 M770 0V280" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Floating Animated Glow Orbs -->
  <circle cx="150" cy="90" r="160" fill="url(#orb-cyan)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 50,30; -20,40; 0,0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="180" r="180" fill="url(#orb-purple)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,-30; 30,-20; 0,0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="425" cy="240" r="130" fill="url(#orb-emerald)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,-20; -30,20; 0,0" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Border Outline -->
  <rect x="2" y="2" width="846" height="276" rx="18" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating Particle Stars -->
  <circle cx="120" cy="60" r="2" fill="#38bdf8" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="70" r="2.5" fill="#a78bfa" opacity="0.7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="220" r="2" fill="#34d399" opacity="0.9">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="230" r="1.8" fill="#f472b6" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main Name Header Title -->
  <g filter="url(#glow)">
    <text x="425" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="url(#title-grad)" letter-spacing="1">
      Khairul Huda
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="425" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="3">
    FULL STACK DEVELOPER • ML ENGINEER • WEB3 EXPLORER
  </text>

  <!-- Animated Pill Badges Row -->
  <g transform="translate(115, 185)">
    <!-- Pill 1: Web Dev -->
    <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="67" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">💻 Full Stack</text>

    <!-- Pill 2: AI / ML -->
    <rect x="150" y="0" width="135" height="34" rx="17" fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="217" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">🤖 AI / ML Eng</text>

    <!-- Pill 3: Mobile Dev -->
    <rect x="300" y="0" width="135" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2"/>
    <text x="367" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">📱 Mobile Dev</text>

    <!-- Pill 4: Open Source -->
    <rect x="450" y="0" width="165" height="34" rx="17" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1.2"/>
    <text x="532" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f472b6">🌐 Open Source</text>
  </g>
</svg>
